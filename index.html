<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> 七夕粿 </title>
    <style>
        /* 設定整個網頁的背景顏色與字型大小 */
        body {
            background-color: #993300; /* 淺藍色背景 */
            font-family: Arial, sans-serif; /* 設定字體 */
            text-align: center; /* 讓內容居中 */
            color: #ffffff; /* 文字顏色 */
        }

        /* 設定標題顏色與大小 */
        h1 {
            color: #2c3e50;
            font-size: 36px; /* 標題字體大小 */
        }

        /* 設定段落文字大小 */
        p {
            font-size: 20px;
            line-height: 1.6;
        }

        /* 設定圖片樣式 */
        img {
            border-radius: 15px; /* 讓圖片圓角 */
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>七夕粿</h1>
    
    <p>這是一個經過美化的網頁！</p>


</body>
</html>

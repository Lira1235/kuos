<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>製作七夕粿！</title>
    <style>
        /* 設定整個網頁的背景顏色與字型大小 */
        body {
            background-color: #9b4331; /* 淺藍色背景 */
            font-family: Arial, sans-serif; /* 設定字體 */
            text-align: Left; /* 讓內容居中 */
            color: #ffffff; /* 文字顏色 */
        }

        /* 設定標題顏色與大小 */
        h1 {
            color: #cccc99;
            font-size: 60px; /* 標題字體大小 */
        }

        /* 設定段落文字大小 */
        p {
            font-size: 40px;
            line-height: 1.6;
        }

        /* 設定圖片樣式 */
        img {
            border-radius: 15px; /* 讓圖片圓角 */
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>製作七夕粿！</h1>
    
    <p>
1.準備粉團：糯米粉加水揉成團，搓圓後用手指壓出中心凹洞。<br>
2.水煮：將粉團放入滾水中煮至浮起。<br>
3.製作糖水：糖（白糖、黑糖皆可）加水煮成糖水。<br>
4.組合：將煮好的糖粿放入碗中，淋上糖水即可，也可加花生碎。</p>


</body>
</html>
